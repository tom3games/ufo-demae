<body>

  <div id="lock" class="lock hidden"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="14 9"/><path d="M50 4v18M50 78v18M4 50h18M78 50h18" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg><span data-t="lockOn"></span></div>

    <div id="oChain" class="o-chain"><b id="oMult">x1</b><span id="oChainN"></span><i class="o-bar"><i id="oChainBar"></i></i></div>

      <rect x="22" y="0" width="32" height="8" rx="2" fill="#55585a"/><rect x="3" y="6" width="70" height="84" rx="6" fill="#26292c" stroke="#0c0d0e" stroke-width="3"/><path d="M60 6 L66 0" stroke="#55585a" stroke-width="3"/><g id="packCells"></g></svg>

      <rect width="240" height="150" fill="url(#bsky)"/>
      <g class="bc-beam"><path d="M150 34 L118 150 L182 150Z" fill="url(#bbeam)"/></g>
      <g class="bc-ufo"><ellipse cx="150" cy="32" rx="22" ry="5" fill="#0e0f12"/><ellipse cx="150" cy="28" rx="8" ry="5" fill="#17363c"/><g fill="#8ff7ff"><circle cx="134" cy="33" r="1.5"/><circle cx="144" cy="35" r="1.5"/><circle cx="156" cy="35" r="1.5"/><circle cx="166" cy="33" r="1.5"/></g></g>
      <path d="M0 150 V112 H14 V96 H22 L26 90 L30 96 H36 V120 H44 V84 L52 80 V74 H60 V86 L66 92 L70 88 V122 H82 V100 H96 V94 L100 98 L104 92 V128 H116 V108 L124 104 L130 110 V96 H142 L146 102 V130 H156 V90 H166 V82 L170 86 V118 H180 V104 H190 L196 98 V124 H206 V92 H214 L218 96 L222 90 V114 H232 V108 H240 V150Z" fill="#0f0d10"/>
      <g fill="#ff7a2a" class="bc-fire"><rect x="47" y="98" width="4" height="3"/><rect x="88" y="110" width="4" height="3"/><rect x="160" y="100" width="3" height="3"/><rect x="209" y="104" width="4" height="3"/></g>
      <g class="bc-ash" fill="#bdb3aa"><circle cx="30" cy="20" r="1"/><circle cx="80" cy="10" r="1"/><circle cx="120" cy="40" r=".8"/><circle cx="200" cy="18" r="1"/><circle cx="60" cy="60" r=".8"/><circle cx="220" cy="50" r=".8"/></g>
    </svg>
  </div>
  <p class="boot-msg" data-t="loading">通信を確立中</p>
  <div class="boot-bar"><i id="bootBar"></i></div><span id="bootPct" class="boot-pct">0%</span>
</div>
<script>
// ロード画面の進み具合（本体が動き出したら game.js が __bootSet で進める。それまでは少しずつ進める）
(function(){
  var bar=document.getElementById('bootBar'),pct=document.getElementById('bootPct'),k=0,real=false;
  function draw(){bar.style.transform='scaleX('+k.toFixed(3)+')';pct.textContent=Math.round(k*100)+'%'}
  window.__bootSet=function(v){real=true;if(v>k){k=Math.min(1,v);draw()}};
  var t=setInterval(function(){if(real||window.__bootDone){clearInterval(t);return}k=Math.min(0.3,k+0.01);draw()},200);
  draw();
})();
</script>

<script>
// 拡大を止める（ピンチ・ダブルタップ・Ctrl+ホイール）。iOS は user-scalable=no を無視するので JS でも止める
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
// 起動失敗の保険: エラーがあって 12 秒たっても準備できていない、または 60 秒たっても準備できていない時に原因を出す（読み込み中は失敗と出さない）
(function(){
  var errs=[];
  window.addEventListener('error',function(e){var tg=e.target;if(tg&&tg!==window&&(tg.src||tg.href))errs.push('load failed: '+(tg.src||tg.href));else errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))},true);
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  function show(){
    if(window.__ufoReady||document.getElementById('boot-err')) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  }
  setTimeout(function(){if(errs.length)show()},12000);
  setTimeout(show,60000);
})();
</script>
